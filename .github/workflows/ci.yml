name: CI

# Single pipeline matching this repo's real layout (apps/*, Bun workspaces).
# Static checks only (typecheck / build / schema validation) so no database,
# secrets, or external services are needed for CI to pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Production build
        working-directory: apps/web
        run: bun run build

  api:
    name: API typecheck + Prisma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema + generate client
        working-directory: apps/api
        env:
          # .env is gitignored; validation/generation never connect,
          # they only need the vars to exist.
          POSTGRES_URL: postgresql://test:test@localhost:5432/test
          POSTGRES_DIRECT_URL: postgresql://test:test@localhost:5432/test
        run: |
          bun x prisma validate
          bun x prisma generate

      - name: Typecheck
        working-directory: apps/api
        run: bun run typecheck

  ai-service:
    name: AI service import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/ai-service/requirements.txt

      - name: Compile check
        run: python -m compileall -q apps/ai-service/app

  rust-worker:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Check
        working-directory: apps/rust-worker
        run: cargo check --all-targets

      - name: Clippy
        working-directory: apps/rust-worker
        run: cargo clippy --all-targets -- -D warnings
