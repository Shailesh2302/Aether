version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: aether-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aether-network

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: aether-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG__LEVEL: INFO
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-aether-dev-key}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aether-network

  # Application Services
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aether-api
    restart: unless-stopped
    ports:
      - "2401:2401"
    environment:
      - NODE_ENV=development
      - PORT=2401
      - POSTGRES_URL=${POSTGRES_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - AI_SERVICE_URL=http://ai-service:2402
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - STORAGE_TYPE=cloudinary
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - uploads:/app/storage/uploads
      - clips:/app/storage/clips
    networks:
      - aether-network
    command: pnpm run dev

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    container_name: aether-ai-service
    restart: unless-stopped
    ports:
      - "2402:2402"
    environment:
      - PORT=2402
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./apps/ai-service:/app
      - ai_cache:/app/.cache
      - ./storage/temp:/tmp/aether
    networks:
      - aether-network
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 2402 --reload

  rust-worker:
    build:
      context: .
      dockerfile: apps/rust-worker/Dockerfile
    container_name: aether-rust-worker
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_URL=http://api:2401
      - AI_SERVICE_URL=http://ai-service:2402
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - STORAGE_BASE_PATH=/tmp/aether
    depends_on:
      - api
      - ai-service
    volumes:
      - video_uploads:/tmp/aether
    networks:
      - aether-network
    command: /usr/local/bin/aether-rust-worker

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aether-web
    restart: unless-stopped
    ports:
      - "2400:2400"
    environment:
      - NODE_ENV=development
      - PORT=2400
      - NEXT_PUBLIC_API_URL=http://api:2401
      - NEXT_PUBLIC_WS_URL=ws://api:2401
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - aether-network
    command: pnpm run dev

  # Monitoring (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: aether-prometheus
    restart: unless-stopped
    ports:
      - "2407:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - aether-network

  grafana:
    image: grafana/grafana:latest
    container_name: aether-grafana
    restart: unless-stopped
    ports:
      - "2408:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - aether-network

volumes:
  qdrant_data:
  uploads:
  clips:
  ai_cache:
  video_uploads:
  prometheus_data:
  grafana_data:

networks:
  aether-network:
    driver: bridge
